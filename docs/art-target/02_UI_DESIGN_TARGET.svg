<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F2EEFB"/>
    </linearGradient>
    <filter id="hudShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#663D63" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="candyPink2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA8D3"/>
      <stop offset="100%" stop-color="#FF7AB8"/>
    </linearGradient>
    <linearGradient id="candyYellow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE785"/>
      <stop offset="100%" stop-color="#FFCE52"/>
    </linearGradient>
    <linearGradient id="candyMint2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BEF2E3"/>
      <stop offset="100%" stop-color="#76D2B8"/>
    </linearGradient>
    <linearGradient id="candyBlue2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4F3FA"/>
      <stop offset="100%" stop-color="#83D3E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad2)"/>

  <!-- Header Banner -->
  <rect x="40" y="25" width="1120" height="65" rx="20" fill="#FFFFFF" filter="url(#hudShadow)"/>
  <circle cx="75" cy="57" r="20" fill="url(#candyYellow2)"/>
  <text x="75" y="64" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">★</text>
  <text x="110" y="64" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#663D63">02 · UI DESIGN TARGET : CANDY TOY HUD &amp; COMPONENTS</text>
  <text x="1010" y="63" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#B38CAE">MIN TARGET ≥ 48×48px</text>

  <!-- LEFT: REALISTIC GAME VIEWPORT COMPOSITE (960x540 representation scaled to 640x360) -->
  <g transform="translate(40, 110)">
    <!-- Viewport Frame -->
    <rect x="0" y="0" width="660" height="390" rx="24" fill="#FFFFFF" stroke="#663D63" stroke-width="2.5" filter="url(#hudShadow)"/>
    <rect x="10" y="10" width="640" height="370" rx="18" fill="#FFF8EE"/>

    <!-- In-game background mini-scene -->
    <rect x="10" y="10" width="640" height="250" fill="#FFEBF4"/>
    <rect x="10" y="260" width="640" height="120" fill="#F0E3D3"/>
    <!-- Baseboard trim -->
    <rect x="10" y="252" width="640" height="12" fill="#FFFFFF" stroke="#663D63" stroke-width="1.5"/>
    <circle cx="330" cy="130" r="45" fill="#FFFFFF" opacity="0.6"/>
    <!-- Window with curtain -->
    <rect x="295" y="90" width="70" height="85" rx="10" fill="#BDEAF5" stroke="#663D63" stroke-width="2"/>
    <line x1="330" y1="90" x2="330" y2="175" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="295" y1="132" x2="365" y2="132" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- TOP HUD OVERLAY -->
    <g transform="translate(20, 20)">
      <!-- Brand pill -->
      <rect x="0" y="0" width="165" height="42" rx="21" fill="#FFFFFF" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
      <circle cx="21" cy="21" r="14" fill="url(#candyPink2)"/>
      <text x="21" y="27" font-family="'Nunito', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">★</text>
      <text x="44" y="26" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#663D63">Qian Hui City</text>

      <!-- Needs meters pill -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="170" height="42" rx="21" fill="#FFFFFF" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <!-- Smile -->
        <circle cx="24" cy="21" r="11" fill="#FFF3D4"/>
        <text x="24" y="26" font-family="'Segoe UI Emoji', sans-serif" font-size="12" text-anchor="middle">😊</text>
        <rect x="38" y="16" width="30" height="10" rx="5" fill="#FFE5A3"/>
        <rect x="38" y="16" width="24" height="10" rx="5" fill="#FFC72C"/>

        <!-- Energy -->
        <circle cx="85" cy="21" r="11" fill="#EBF9FF"/>
        <text x="85" y="26" font-family="'Segoe UI Emoji', sans-serif" font-size="12" text-anchor="middle">⚡</text>
        <rect x="100" y="16" width="30" height="10" rx="5" fill="#CCEFFF"/>
        <rect x="100" y="16" width="22" height="10" rx="5" fill="#4AC3FF"/>
      </g>

      <!-- Star Coin pill -->
      <g transform="translate(365, 0)">
        <rect x="0" y="0" width="115" height="42" rx="21" fill="#FFFFFF" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <circle cx="21" cy="21" r="14" fill="url(#candyYellow2)"/>
        <!-- Star Icon Vector -->
        <path d="M 21 11 L 24 18 L 31 18 L 25 22 L 27 29 L 21 25 L 15 29 L 17 22 L 11 18 L 18 18 Z" fill="#FFFFFF"/>
        <text x="44" y="27" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#663D63">500</text>
      </g>

      <!-- Quick Action Icons -->
      <g transform="translate(495, 0)">
        <!-- Clues -->
        <circle cx="21" cy="21" r="18" fill="#FFFFFF" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <path d="M 14 14 Q 21 10 28 14 L 28 27 Q 21 23 14 27 Z" fill="#FFECCC" stroke="#663D63" stroke-width="1.5"/>

        <!-- Brain -->
        <circle cx="65" cy="21" r="18" fill="#FFFFFF" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <circle cx="60" cy="18" r="5" fill="#FFA8D3"/>
        <circle cx="70" cy="18" r="5" fill="#FFA8D3"/>
        <circle cx="65" cy="24" r="5.5" fill="#FFA8D3"/>

        <!-- Sound -->
        <circle cx="109" cy="21" r="18" fill="#FFFFFF" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <path d="M 103 21 L 107 16 L 112 16 L 112 26 L 107 26 Z" fill="#A8EAD7" stroke="#663D63" stroke-width="1.5"/>
      </g>
    </g>

    <!-- IN-CANVAS TOY CHARACTER (MINI) -->
    <g transform="translate(320, 240)">
      <ellipse cx="0" cy="55" rx="35" ry="9" fill="#663D63" opacity="0.2"/>
      <circle cx="0" cy="-20" r="32" fill="#FFE5D6"/>
      <!-- Waves Hair -->
      <circle cx="0" cy="-24" r="34" fill="#E8B872"/>
      <circle cx="-16" cy="-36" r="13" fill="#E8B872"/><circle cx="0" cy="-38" r="15" fill="#E8B872"/><circle cx="16" cy="-36" r="13" fill="#E8B872"/>
      <!-- Eyes & Cheeks -->
      <ellipse cx="-11" cy="-20" rx="4" ry="6" fill="#663D63"/><ellipse cx="11" cy="-20" rx="4" ry="6" fill="#663D63"/>
      <circle cx="-12" cy="-22" r="1.5" fill="#FFFFFF"/><circle cx="10" cy="-22" r="1.5" fill="#FFFFFF"/>
      <ellipse cx="-18" cy="-12" rx="6" ry="3.5" fill="#FF8FC4" opacity="0.7"/><ellipse cx="18" cy="-12" rx="6" ry="3.5" fill="#FF8FC4" opacity="0.7"/>
      <!-- Pinafore dress -->
      <rect x="-20" y="8" width="40" height="38" rx="10" fill="#9DE0F0" stroke="#663D63" stroke-width="2"/>
      <rect x="-11" y="16" width="22" height="20" rx="6" fill="#FFFFFF"/>
      <!-- Shoes -->
      <rect x="-16" y="44" width="12" height="12" rx="5" fill="#FF8FC4" stroke="#663D63" stroke-width="1.5"/>
      <rect x="4" y="44" width="12" height="12" rx="5" fill="#FF8FC4" stroke="#663D63" stroke-width="1.5"/>
    </g>

    <!-- BOTTOM NAVIGATION BAR (UNIFIED VECTOR ICONS) -->
    <g transform="translate(18, 310)">
      <rect x="0" y="0" width="624" height="60" rx="22" fill="#FFFFFF" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>

      <!-- Nav Button: Town -->
      <g transform="translate(12, 6)">
        <rect x="0" y="0" width="56" height="48" rx="14" fill="#F7EFF8"/>
        <path d="M 18 16 L 28 12 L 38 16 L 38 32 L 28 28 L 18 32 Z" fill="#BDEAF5" stroke="#663D63" stroke-width="1.5"/>
        <text x="28" y="42" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#663D63" text-anchor="middle">Town</text>
      </g>

      <!-- Nav Button: Home (Active) -->
      <g transform="translate(74, 4)">
        <rect x="0" y="0" width="58" height="50" rx="14" fill="url(#candyPink2)" stroke="#663D63" stroke-width="2"/>
        <path d="M 20 22 L 29 14 L 38 22 L 38 32 L 20 32 Z" fill="#FFFFFF" stroke="#663D63" stroke-width="1.5"/>
        <text x="29" y="43" font-family="'Nunito', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">Home</text>
      </g>

      <!-- Room Switcher Pills -->
      <g transform="translate(142, 11)">
        <rect x="0" y="0" width="105" height="38" rx="19" fill="#FFFDF7" stroke="#663D63" stroke-width="1.5"/>
        <circle cx="19" cy="19" r="14" fill="url(#candyPink2)"/>
        <text x="19" y="24" font-family="'Nunito', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">Bed</text>
        <circle cx="52" cy="19" r="14" fill="#F7EFF8"/>
        <text x="52" y="23" font-family="'Nunito', sans-serif" font-size="10" font-weight="800" fill="#663D63" text-anchor="middle">Live</text>
        <circle cx="85" cy="19" r="14" fill="#F7EFF8"/>
        <text x="85" y="23" font-family="'Nunito', sans-serif" font-size="10" font-weight="800" fill="#663D63" text-anchor="middle">Cook</text>
      </g>

      <!-- Nav Button: Bag (Inventory) -->
      <g transform="translate(258, 6)">
        <rect x="0" y="0" width="56" height="48" rx="14" fill="#F7EFF8"/>
        <rect x="18" y="16" width="20" height="16" rx="5" fill="#FFD96F" stroke="#663D63" stroke-width="1.5"/>
        <path d="M 23 16 Q 28 10 33 16" fill="none" stroke="#663D63" stroke-width="1.5"/>
        <text x="28" y="42" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#663D63" text-anchor="middle">Bag</text>
      </g>

      <!-- Nav Button: Wardrobe -->
      <g transform="translate(320, 6)">
        <rect x="0" y="0" width="56" height="48" rx="14" fill="#F7EFF8"/>
        <path d="M 20 20 L 28 15 L 36 20 L 33 32 L 23 32 Z" fill="#CAB8F1" stroke="#663D63" stroke-width="1.5"/>
        <text x="28" y="42" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#663D63" text-anchor="middle">Dress</text>
      </g>

      <!-- Nav Button: Avatar Studio -->
      <g transform="translate(382, 6)">
        <rect x="0" y="0" width="56" height="48" rx="14" fill="#F7EFF8"/>
        <circle cx="28" cy="22" r="7" fill="#FFA8D3" stroke="#663D63" stroke-width="1.5"/>
        <text x="28" y="42" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#663D63" text-anchor="middle">Avatar</text>
      </g>

      <!-- Nav Button: Pet Whistle -->
      <g transform="translate(444, 6)">
        <rect x="0" y="0" width="56" height="48" rx="14" fill="#F7EFF8"/>
        <ellipse cx="28" cy="23" rx="5" ry="4" fill="#FFC4A8" stroke="#663D63" stroke-width="1.5"/>
        <circle cx="22" cy="18" r="2" fill="#FFC4A8"/><circle cx="28" cy="16" r="2" fill="#FFC4A8"/><circle cx="34" cy="18" r="2" fill="#FFC4A8"/>
        <text x="28" y="42" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#663D63" text-anchor="middle">Pet</text>
      </g>

      <!-- Nav Button: Edit Mode -->
      <g transform="translate(506, 6)">
        <rect x="0" y="0" width="56" height="48" rx="14" fill="#F7EFF8"/>
        <path d="M 22 28 L 32 18 L 35 21 L 25 31 Z" fill="#A8EAD7" stroke="#663D63" stroke-width="1.5"/>
        <text x="28" y="42" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#663D63" text-anchor="middle">Edit</text>
      </g>

      <!-- Reset -->
      <g transform="translate(568, 6)">
        <rect x="0" y="0" width="44" height="48" rx="14" fill="#F7EFF8"/>
        <path d="M 22 17 A 7 7 0 1 1 17 24" fill="none" stroke="#663D63" stroke-width="2"/>
        <text x="22" y="42" font-family="'Nunito', sans-serif" font-size="8" font-weight="800" fill="#663D63" text-anchor="middle">Reset</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: UI COMPONENT DESIGN SYSTEM -->
  <g transform="translate(730, 110)">
    <!-- Component Box -->
    <rect x="0" y="0" width="430" height="650" rx="24" fill="#FFFFFF" stroke="#663D63" stroke-width="2.5" filter="url(#hudShadow)"/>
    <text x="25" y="40" font-family="'Nunito', sans-serif" font-size="18" font-weight="800" fill="#663D63">UI COMPONENT SYSTEM</text>

    <!-- 1. BUTTON STATES -->
    <g transform="translate(25, 60)">
      <text x="0" y="0" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#B38CAE">CANDY BUTTON HIERARCHY</text>
      
      <!-- Primary Normal -->
      <g transform="translate(0, 15)">
        <rect x="0" y="3" width="115" height="44" rx="22" fill="#663D63" opacity="0.2"/>
        <rect x="0" y="0" width="115" height="44" rx="22" fill="url(#candyPink2)" stroke="#FFFFFF" stroke-width="2"/>
        <path d="M 12 12 Q 57 7 103 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <text x="57" y="27" font-family="'Nunito', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">Primary</text>
      </g>

      <!-- Primary Pressed (Compacted) -->
      <g transform="translate(130, 18)">
        <rect x="0" y="0" width="110" height="41" rx="20" fill="url(#candyPink2)" stroke="#663D63" stroke-width="1.5"/>
        <text x="55" y="26" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">Pressed 0.95x</text>
      </g>

      <!-- Secondary Button -->
      <g transform="translate(255, 15)">
        <rect x="0" y="0" width="115" height="44" rx="22" fill="#FFFDF7" stroke="#663D63" stroke-width="2"/>
        <text x="57" y="27" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#663D63" text-anchor="middle">Secondary</text>
      </g>
    </g>

    <!-- 2. INVENTORY SLOTS -->
    <g transform="translate(25, 160)">
      <text x="0" y="0" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#B38CAE">ITEM SLOTS &amp; SELECTION</text>

      <!-- Normal Slot -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="60" height="60" rx="18" fill="#FFFDF7" stroke="#663D63" stroke-width="2"/>
        <circle cx="30" cy="30" r="14" fill="#FF8FC4"/>
        <text x="30" y="55" font-family="'Nunito', sans-serif" font-size="10" font-weight="800" fill="#663D63" text-anchor="middle">x3</text>
      </g>

      <!-- Selected Slot (Glow Bezel) -->
      <g transform="translate(75, 15)">
        <rect x="-3" y="-3" width="66" height="66" rx="21" fill="none" stroke="#FFD96F" stroke-width="3"/>
        <rect x="0" y="0" width="60" height="60" rx="18" fill="#FFFDF7" stroke="#663D63" stroke-width="2"/>
        <circle cx="30" cy="30" r="14" fill="#A8EAD7"/>
        <circle cx="50" cy="10" r="8" fill="url(#candyPink2)"/>
        <text x="50" y="14" font-family="'Nunito', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
      </g>

      <!-- Locked Slot -->
      <g transform="translate(150, 15)">
        <rect x="0" y="0" width="60" height="60" rx="18" fill="#F0E8F0" stroke="#B38CAE" stroke-width="1.5"/>
        <rect x="22" y="24" width="16" height="14" rx="4" fill="#754C72"/>
        <path d="M 25 24 L 25 18 Q 30 14 35 18 L 35 24" fill="none" stroke="#754C72" stroke-width="2"/>
      </g>

      <!-- Close Button -->
      <g transform="translate(235, 15)">
        <circle cx="30" cy="30" r="22" fill="#FF8FC4" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <line x1="22" y1="22" x2="38" y2="38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <line x1="38" y1="22" x2="22" y2="38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <text x="65" y="35" font-family="'Nunito', sans-serif" font-size="12" font-weight="700" fill="#663D63">Close Button</text>
      </g>
    </g>

    <!-- 3. SHOP CARD & SPEECH BUBBLE -->
    <g transform="translate(25, 275)">
      <text x="0" y="0" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#B38CAE">SHOP CARD &amp; DIALOG</text>

      <!-- Shop card -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="120" height="140" rx="20" fill="#FFFDF7" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <rect x="12" y="12" width="96" height="60" rx="14" fill="#FDF1F7"/>
        <!-- dress icon -->
        <path d="M 45 28 L 60 20 L 75 28 L 70 54 L 50 54 Z" fill="#FF8FC4" stroke="#663D63" stroke-width="1.5"/>
        <text x="60" y="90" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#663D63" text-anchor="middle">Bunny Dress</text>
        <!-- Price badge -->
        <rect x="25" y="102" width="70" height="24" rx="12" fill="#FFF2CE" stroke="#663D63" stroke-width="1.5"/>
        <text x="60" y="118" font-family="'Nunito', sans-serif" font-size="11" font-weight="900" fill="#DE9F1D" text-anchor="middle">⭐ 55</text>
      </g>

      <!-- Speech Bubble Component -->
      <g transform="translate(145, 15)">
        <path d="M 12 0 L 210 0 Q 225 0 225 15 L 225 75 Q 225 90 210 90 L 40 90 L 15 110 L 22 90 L 12 90 Q 0 90 0 75 L 0 15 Q 0 0 12 0 Z" fill="#FFFDF7" stroke="#663D63" stroke-width="2" filter="url(#hudShadow)"/>
        <text x="25" y="32" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#FF7AB8">Clara (Shopkeeper):</text>
        <text x="25" y="52" font-family="'Nunito', sans-serif" font-size="12" font-weight="700" fill="#663D63">"Try something cute today!</text>
        <text x="25" y="70" font-family="'Nunito', sans-serif" font-size="12" font-weight="700" fill="#663D63">Preview it in the mirror!"</text>
      </g>
    </g>

    <!-- 4. TOAST NOTIFICATION & COMING SOON BADGE -->
    <g transform="translate(25, 475)">
      <text x="0" y="0" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#B38CAE">TOAST &amp; STATUS RIBBONS</text>

      <!-- Toast -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="375" height="52" rx="26" fill="url(#candyYellow2)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#hudShadow)"/>
        <circle cx="28" cy="26" r="16" fill="#FFFFFF"/>
        <text x="28" y="32" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" fill="#DE9F1D" text-anchor="middle">★</text>
        <text x="60" y="32" font-family="'Nunito', sans-serif" font-size="14" font-weight="900" fill="#663D63">Treasure Found! +25 Star Coins</text>
      </g>

      <!-- Coming Soon Ribbon -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="160" height="34" rx="17" fill="#CAB8F1" stroke="#663D63" stroke-width="1.5"/>
        <text x="80" y="22" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Coming Soon Ribbon</text>
      </g>

      <!-- Owned Badge -->
      <g transform="translate(180, 85)">
        <rect x="0" y="0" width="120" height="34" rx="17" fill="#A8EAD7" stroke="#663D63" stroke-width="1.5"/>
        <text x="60" y="22" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" fill="#2E7E69" text-anchor="middle">✓ WEAR</text>
      </g>
    </g>

  </g>

</svg>
