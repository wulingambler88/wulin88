<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F5EEFA"/>
    </linearGradient>
    <filter id="animShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#663D63" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="candyPink5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA8D3"/>
      <stop offset="100%" stop-color="#FF7AB8"/>
    </linearGradient>
    <linearGradient id="candyYellow5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE785"/>
      <stop offset="100%" stop-color="#FFCE52"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad5)"/>

  <!-- Header Banner -->
  <rect x="40" y="25" width="1120" height="65" rx="20" fill="#FFFFFF" filter="url(#animShadow)"/>
  <circle cx="75" cy="57" r="20" fill="#CAB8F1"/>
  <text x="75" y="64" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#663D63" text-anchor="middle">★</text>
  <text x="110" y="64" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#663D63">05 · ANIMATION LANGUAGE &amp; MOTION DESIGN SHEET</text>
  <text x="970" y="63" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#B38CAE">EASING: EASE_OUT_BACK / BOUNCE</text>

  <!-- ROW 1: BUTTON PRESS & ITEM DRAG/DROP TIMING CURVES -->
  <g transform="translate(40, 110)">
    <!-- Card 1: Button Tap Compression -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="540" height="200" rx="22" fill="#FFFFFF" stroke="#663D63" stroke-width="2.5" filter="url(#animShadow)"/>
      <text x="25" y="32" font-family="'Nunito', sans-serif" font-size="15" font-weight="800" fill="#663D63">1. BUTTON TAP COMPRESSION (140ms TOTAL)</text>
      
      <!-- Frame Sequence -->
      <g transform="translate(30, 50)">
        <!-- Frame 0ms (Rest 1.00) -->
        <g transform="translate(0, 10)">
          <rect x="0" y="0" width="80" height="42" rx="21" fill="url(#candyPink5)" stroke="#663D63" stroke-width="2"/>
          <text x="40" y="26" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Play</text>
          <text x="40" y="60" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#663D63" text-anchor="middle">0ms (1.00x)</text>
        </g>

        <!-- Arrow -->
        <path d="M 95 30 L 115 30 M 110 25 L 117 30 L 110 35" stroke="#B38CAE" stroke-width="2" fill="none"/>

        <!-- Frame 60ms (Squash 0.94x) -->
        <g transform="translate(130, 14)">
          <rect x="0" y="0" width="75" height="36" rx="18" fill="url(#candyPink5)" stroke="#663D63" stroke-width="2"/>
          <text x="37" y="23" font-family="'Nunito', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">Play</text>
          <text x="37" y="56" font-family="'Nunito', sans-serif" font-size="11" font-weight="900" fill="#DE4A90" text-anchor="middle">60ms (0.94x)</text>
        </g>

        <!-- Arrow -->
        <path d="M 220 30 L 240 30 M 235 25 L 242 30 L 235 35" stroke="#B38CAE" stroke-width="2" fill="none"/>

        <!-- Frame 100ms (Overshoot 1.02x) -->
        <g transform="translate(255, 9)">
          <rect x="0" y="0" width="82" height="44" rx="22" fill="url(#candyPink5)" stroke="#663D63" stroke-width="2"/>
          <text x="41" y="27" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Play</text>
          <text x="41" y="61" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#663D63" text-anchor="middle">100ms (1.02x)</text>
        </g>

        <!-- Arrow -->
        <path d="M 350 30 L 370 30 M 365 25 L 372 30 L 365 35" stroke="#B38CAE" stroke-width="2" fill="none"/>

        <!-- Frame 140ms (Settled 1.00x) -->
        <g transform="translate(385, 10)">
          <rect x="0" y="0" width="80" height="42" rx="21" fill="url(#candyPink5)" stroke="#663D63" stroke-width="2"/>
          <text x="40" y="26" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Play</text>
          <text x="40" y="60" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#2E7E69" text-anchor="middle">140ms (Settle)</text>
        </g>
      </g>

      <text x="25" y="165" font-family="'Nunito', sans-serif" font-size="11" fill="#754C72">Instant tactile compression feedback on touch down; immediate spring-back on release.</text>
    </g>

    <!-- Card 2: Drag Pickup & Drop Squash-Settle -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="540" height="200" rx="22" fill="#FFFFFF" stroke="#663D63" stroke-width="2.5" filter="url(#animShadow)"/>
      <text x="25" y="32" font-family="'Nunito', sans-serif" font-size="15" font-weight="800" fill="#663D63">2. ITEM &amp; CHARACTER DRAG/DROP (220ms TOTAL)</text>

      <g transform="translate(30, 45)">
        <!-- Step A: Rest on floor -->
        <g transform="translate(0, 10)">
          <ellipse cx="25" cy="55" rx="22" ry="6" fill="#663D63" opacity="0.22"/>
          <circle cx="25" cy="25" r="22" fill="#FFA8D3" stroke="#663D63" stroke-width="2"/>
          <text x="25" y="76" font-family="'Nunito', sans-serif" font-size="10" font-weight="700" fill="#663D63" text-anchor="middle">Rest</text>
        </g>

        <!-- Arrow -->
        <path d="M 60 35 L 80 35 M 75 30 L 82 35 L 75 40" stroke="#B38CAE" stroke-width="2" fill="none"/>

        <!-- Step B: Pickup Lift (1.08x) -->
        <g transform="translate(95, 0)">
          <!-- Far shadow -->
          <ellipse cx="28" cy="65" rx="30" ry="8" fill="#663D63" opacity="0.12"/>
          <!-- Lifted item -->
          <circle cx="28" cy="20" r="26" fill="#FFA8D3" stroke="#663D63" stroke-width="2.5"/>
          <text x="28" y="86" font-family="'Nunito', sans-serif" font-size="10" font-weight="900" fill="#DE4A90" text-anchor="middle">Lift 1.08x</text>
        </g>

        <!-- Arrow -->
        <path d="M 165 35 L 185 35 M 180 30 L 187 35 L 180 40" stroke="#B38CAE" stroke-width="2" fill="none"/>

        <!-- Step C: Drop Impact Squash -->
        <g transform="translate(200, 14)">
          <ellipse cx="32" cy="52" rx="32" ry="7" fill="#663D63" opacity="0.25"/>
          <!-- Squashed horizontal ellipse -->
          <ellipse cx="32" cy="28" rx="27" ry="18" fill="#FFA8D3" stroke="#663D63" stroke-width="2"/>
          <text x="32" y="72" font-family="'Nunito', sans-serif" font-size="10" font-weight="900" fill="#DE4A90" text-anchor="middle">Squash 0.92y</text>
        </g>

        <!-- Arrow -->
        <path d="M 275 35 L 295 35 M 290 30 L 297 35 L 290 40" stroke="#B38CAE" stroke-width="2" fill="none"/>

        <!-- Step D: Stretch Bounce -->
        <g transform="translate(310, 6)">
          <ellipse cx="25" cy="58" rx="20" ry="5" fill="#663D63" opacity="0.2"/>
          <!-- Stretched vertical ellipse -->
          <ellipse cx="25" cy="25" rx="19" ry="25" fill="#FFA8D3" stroke="#663D63" stroke-width="2"/>
          <text x="25" y="80" font-family="'Nunito', sans-serif" font-size="10" font-weight="700" fill="#663D63" text-anchor="middle">Rebound</text>
        </g>

        <!-- Arrow -->
        <path d="M 365 35 L 385 35 M 380 30 L 387 35 L 380 40" stroke="#B38CAE" stroke-width="2" fill="none"/>

        <!-- Step E: Settle Rest -->
        <g transform="translate(400, 10)">
          <ellipse cx="25" cy="55" rx="22" ry="6" fill="#663D63" opacity="0.22"/>
          <circle cx="25" cy="25" r="22" fill="#FFA8D3" stroke="#663D63" stroke-width="2"/>
          <text x="25" y="76" font-family="'Nunito', sans-serif" font-size="10" font-weight="900" fill="#2E7E69" text-anchor="middle">Settle 1.00</text>
        </g>
      </g>

      <text x="25" y="165" font-family="'Nunito', sans-serif" font-size="11" fill="#754C72">Physics squash-and-settle eliminates cardboard stiffness and gives props playful weight.</text>
    </g>
  </g>

  <!-- ROW 2: IDLE BREATHING, BLINKING & PANEL MODAL TRANSITION -->
  <g transform="translate(40, 330)">
    <!-- Card 3: Idle Breathing & Eye Blinking -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="540" height="210" rx="22" fill="#FFFFFF" stroke="#663D63" stroke-width="2.5" filter="url(#animShadow)"/>
      <text x="25" y="32" font-family="'Nunito', sans-serif" font-size="15" font-weight="800" fill="#663D63">3. CHARACTER IDLE BREATHING &amp; NATURAL BLINKING</text>

      <g transform="translate(30, 50)">
        <!-- Idle Wave Curve Graph -->
        <g transform="translate(10, 0)">
          <rect x="0" y="0" width="220" height="80" rx="10" fill="#FBF7FD" stroke="#663D63" stroke-width="1.5"/>
          <!-- Sine wave curve -->
          <path d="M 10 40 Q 60 10 110 40 Q 160 70 210 40" fill="none" stroke="#FF7AB8" stroke-width="3" stroke-linecap="round"/>
          <circle cx="60" cy="25" r="4" fill="#DE4A90"/>
          <text x="60" y="18" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#DE4A90" text-anchor="middle">Breathe In (+1.5% Y)</text>
          <text x="110" y="95" font-family="'Nunito', sans-serif" font-size="10" font-weight="700" fill="#663D63" text-anchor="middle">Loop: 2.800ms sine cycle</text>
        </g>

        <!-- Blinking Timeline -->
        <g transform="translate(260, 0)">
          <!-- Open Eyes -->
          <g transform="translate(0, 10)">
            <ellipse cx="15" cy="20" rx="6" ry="9" fill="#663D63"/><circle cx="13" cy="17" r="2.5" fill="#FFFFFF"/>
            <ellipse cx="35" cy="20" rx="6" ry="9" fill="#663D63"/><circle cx="33" cy="17" r="2.5" fill="#FFFFFF"/>
            <text x="25" y="45" font-family="'Nunito', sans-serif" font-size="9" font-weight="700" fill="#663D63" text-anchor="middle">Open (3.5s)</text>
          </g>
          <!-- Blink -->
          <g transform="translate(70, 10)">
            <line x1="8" y1="20" x2="22" y2="20" stroke="#663D63" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="28" y1="20" x2="42" y2="20" stroke="#663D63" stroke-width="2.5" stroke-linecap="round"/>
            <text x="25" y="45" font-family="'Nunito', sans-serif" font-size="9" font-weight="900" fill="#FF7AB8" text-anchor="middle">Blink (120ms)</text>
          </g>
          <!-- Double Blink -->
          <g transform="translate(140, 10)">
            <line x1="8" y1="20" x2="22" y2="20" stroke="#663D63" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="28" y1="20" x2="42" y2="20" stroke="#663D63" stroke-width="2.5" stroke-linecap="round"/>
            <text x="25" y="45" font-family="'Nunito', sans-serif" font-size="9" font-weight="700" fill="#663D63" text-anchor="middle">20% Double</text>
          </g>
          <text x="95" y="95" font-family="'Nunito', sans-serif" font-size="10" font-weight="700" fill="#663D63" text-anchor="middle">Random interval: 2.5s – 5.5s</text>
        </g>
      </g>

      <text x="25" y="175" font-family="'Nunito', sans-serif" font-size="11" fill="#754C72">Subtle breathing and natural blinking create an organic, living dollhouse feeling.</text>
    </g>

    <!-- Card 4: Modal Panel Pop & Scene Transition -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="540" height="210" rx="22" fill="#FFFFFF" stroke="#663D63" stroke-width="2.5" filter="url(#animShadow)"/>
      <text x="25" y="32" font-family="'Nunito', sans-serif" font-size="15" font-weight="800" fill="#663D63">4. PANEL POP-IN &amp; PASTEL SCENE TRANSITIONS</text>

      <g transform="translate(30, 50)">
        <!-- Panel Pop-in Step -->
        <g transform="translate(10, 0)">
          <rect x="0" y="0" width="220" height="85" rx="12" fill="#FFFDF7" stroke="#663D63" stroke-width="2"/>
          <text x="110" y="28" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#663D63" text-anchor="middle">Panel Pop-In: 220ms</text>
          <text x="110" y="46" font-family="'Nunito', sans-serif" font-size="10" fill="#754C72" text-anchor="middle">scale: 0.90 → 1.02 → 1.00</text>
          <text x="110" y="64" font-family="'Nunito', sans-serif" font-size="10" font-weight="700" fill="#2E7E69" text-anchor="middle">Easing: Back.easeOut</text>
        </g>

        <!-- Pastel Scene Iris Transition -->
        <g transform="translate(260, 0)">
          <rect x="0" y="0" width="220" height="85" rx="12" fill="#DDF5FC" stroke="#663D63" stroke-width="2"/>
          <circle cx="110" cy="42" r="30" fill="#FFA8D3" stroke="#FFFFFF" stroke-width="3"/>
          <text x="110" y="46" font-family="'Nunito', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">Pastel Iris</text>
          <text x="110" y="98" font-family="'Nunito', sans-serif" font-size="10" font-weight="700" fill="#663D63" text-anchor="middle">320ms expanding circle transition</text>
        </g>
      </g>

      <text x="25" y="175" font-family="'Nunito', sans-serif" font-size="11" fill="#754C72">Replaces harsh black screen fades with cozy, joyful candy transitions.</text>
    </g>
  </g>

  <!-- ROW 3: CENTRAL TIMING TOKENS TABLE (BOTTOM) -->
  <g transform="translate(40, 560)">
    <rect x="0" y="0" width="1120" height="200" rx="22" fill="#FFFFFF" stroke="#663D63" stroke-width="2.5" filter="url(#animShadow)"/>
    <text x="30" y="34" font-family="'Nunito', sans-serif" font-size="16" font-weight="800" fill="#663D63">CENTRAL MOTION TOKENS SPECIFICATION (`src/theme/MotionTokens.ts`)</text>

    <!-- Table Header -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="1060" height="30" rx="8" fill="#F7EFF8"/>
      <text x="20" y="20" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#754C72">INTERACTION EVENT</text>
      <text x="250" y="20" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#754C72">DURATION</text>
      <text x="420" y="20" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#754C72">EASING</text>
      <text x="650" y="20" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#754C72">SCALE / OFFSET VALUES</text>
      <text x="900" y="20" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#754C72">PURPOSE</text>

      <!-- Row 1: Button Press -->
      <line x1="0" y1="32" x2="1060" y2="32" stroke="#E8D1E5" stroke-width="1"/>
      <text x="20" y="48" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#663D63">Button Touch Down / Up</text>
      <text x="250" y="48" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#DE4A90">70ms down / 120ms up</text>
      <text x="420" y="48" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Cubic.easeOut</text>
      <text x="650" y="48" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">scale: 1.00 → 0.94 → 1.00</text>
      <text x="900" y="48" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Instant tactile confirmation</text>

      <!-- Row 2: Item Drag Pickup -->
      <line x1="0" y1="56" x2="1060" y2="56" stroke="#E8D1E5" stroke-width="1"/>
      <text x="20" y="72" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#663D63">Item Drag Pickup</text>
      <text x="250" y="72" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#DE4A90">140ms</text>
      <text x="420" y="72" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Back.easeOut</text>
      <text x="650" y="72" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">scale: 1.00 → 1.06, shadow Y+12</text>
      <text x="900" y="72" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Z-elevation perception</text>

      <!-- Row 3: Drop Settle -->
      <line x1="0" y1="80" x2="1060" y2="80" stroke="#E8D1E5" stroke-width="1"/>
      <text x="20" y="96" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#663D63">Drop Snap &amp; Settle</text>
      <text x="250" y="96" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#DE4A90">180ms</text>
      <text x="420" y="96" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Bounce.easeOut</text>
      <text x="650" y="96" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">squash: 1.06x / 0.94y → 1.00</text>
      <text x="900" y="96" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Playful landing weight</text>

      <!-- Row 4: Modal Open -->
      <line x1="0" y1="104" x2="1060" y2="104" stroke="#E8D1E5" stroke-width="1"/>
      <text x="20" y="120" font-family="'Nunito', sans-serif" font-size="11" font-weight="700" fill="#663D63">Modal Pop-In</text>
      <text x="250" y="120" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" fill="#DE4A90">220ms</text>
      <text x="420" y="120" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Back.easeOut (1.4)</text>
      <text x="650" y="120" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">scale: 0.92 → 1.02 → 1.00</text>
      <text x="900" y="120" font-family="'Nunito', sans-serif" font-size="11" fill="#663D63">Energetic toy pop</text>
    </g>
  </g>

</svg>
